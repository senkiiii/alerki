<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome - User Type Selection</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #1e1f29;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 0;
    }
    .container {
      background-color: #2c2e43;
      padding: 2rem 3rem;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
      text-align: center;
      width: 320px;
    }
    h1 {
      margin-bottom: 1.5rem;
      font-weight: 700;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      cursor: pointer;
    }
    input[type="radio"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    button {
      padding: 0.6rem 1rem;
      border: none;
      background-color: #6257f7;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #483bd0;
    }
    .flash {
      margin-top: 1rem;
      color: #f87c7c;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome</h1>
    <form method="POST" action="{{ url_for('welcome') }}">
      <label>
        <input type="radio" name="user_type" value="new" /> New User
      </label>
      <label>
        <input type="radio" name="user_type" value="existing" /> Existing User
      </label>
      <button type="submit">Continue</button>
    </form>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">
          {% for m in messages %}
            <div>{{m}}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
  </div>
</body>
</html>
