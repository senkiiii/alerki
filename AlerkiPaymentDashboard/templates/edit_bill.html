<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Edit Bill</title>
  <style>
    /* Minimalist design */
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #222;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 2rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      width: 350px;
      box-shadow: none;
      text-align: left;
    }
    h1 {
      margin-bottom: 1.2rem;
      font-weight: 600;
      font-size: 1.5rem;
      color: #111;
      text-align: center;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    label {
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 0.3rem;
      color: #444;
    }
    input[type="text"],
    input[type="date"],
    input[type="number"],
    select {
      padding: 0.5rem 0.7rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
      box-sizing: border-box;
      background: #fff;
      color: #111;
    }
    input[type="text"]:focus,
    input[type="date"]:focus,
    input[type="number"]:focus,
    select:focus {
      border-color: #007acc;
      box-shadow: 0 0 5px rgba(0,122,204,0.3);
    }
    button {
      margin-top: 1rem;
      padding: 0.6rem;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      background-color: #007acc;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
      width: 100%;
    }
    button:hover {
      background-color: #005fa3;
    }
    .back-link {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
    }
    .back-link a {
      color: #007acc;
      text-decoration: none;
    }
    .back-link a:hover {
      text-decoration: underline;
    }
    .flash {
      margin-top: 1rem;
      color: #d93025;
      font-weight: 600;
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Edit Bill</h1>
    <form method="POST" action="{{ url_for('edit_bill', bill_id=bill.id) }}">
      <label for="name">Bill Name</label>
      <input id="name" name="name" type="text" value="{{ bill.name }}" required />
      
      <label for="bill_type">Bill Type</label>
      <select id="bill_type" name="bill_type" required>
        <option value="">Select Bill Type</option>
        {% for type in bill_types %}
          <option value="{{ type }}" {% if bill.bill_type == type %}selected{% endif %}>{{ type }}</option>
        {% endfor %}
      </select>

      <label for="bill_date">Bill Date</label>
      <input id="bill_date" name="bill_date" type="date" value="{{ bill.bill_date.strftime('%Y-%m-%d') if bill.bill_date }}" required />

      <label for="due_date">Due Date</label>
      <input id="due_date" name="due_date" type="date" value="{{ bill.due_date.strftime('%Y-%m-%d') if bill.due_date }}" required />

      <label for="payment_status">Payment Status</label>
      <select id="payment_status" name="payment_status" required>
        <option value="Pending" {% if bill.payment_status == 'Pending' %}selected{% endif %}>Pending</option>
        <option value="Paid" {% if bill.payment_status == 'Paid' %}selected{% endif %}>Paid</option>
      </select>

      <label for="payment_method">Payment Method</label>
      <select id="payment_method" name="payment_method" required>
        <option value="">Select Payment Method</option>
        {% for method in payment_methods %}
          <option value="{{ method }}" {% if bill.payment_method == method %}selected{% endif %}>{{ method }}</option>
        {% endfor %}
      </select>

      <label for="amount">Amount</label>
      <input id="amount" name="amount" type="number" step="0.01" value="{{ bill.amount }}" required />

      <button type="submit">Update Bill</button>
    </form>
    <div class="back-link">
      <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
    </div>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">
          {% for message in messages %}
            <div>{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
  </div>
</body>
</html>
