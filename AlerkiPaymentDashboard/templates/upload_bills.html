<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Upload Bills</title>
  <style>
    /* Minimalist design */
    body {
      font-family: Arial, sans-serif;
      background: #f9f9f9;
      color: #222;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background: white;
      padding: 2rem;
      border: 1px solid #ddd;
      border-radius: 6px;
      width: 350px;
      box-shadow: none;
      text-align: center;
    }
    h1 {
      margin-bottom: 1.5rem;
      font-weight: 600;
      font-size: 1.5rem;
      color: #111;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      align-items: center;
    }
    input[type="file"] {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
      cursor: pointer;
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    input[type="file"]:focus {
      border-color: #007acc;
      outline: none;
      box-shadow: 0 0 5px rgba(0,122,204,0.3);
    }
    button {
      padding: 0.6rem;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      background-color: #007acc;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
      width: 100%;
    }
    button:hover {
      background-color: #005fa3;
    }
    .back-link {
      margin-top: 1rem;
      font-size: 0.9rem;
      text-align: center;
    }
    .back-link a {
      color: #007acc;
      text-decoration: none;
    }
    .back-link a:hover {
      text-decoration: underline;
    }
    .flash {
      margin-top: 1rem;
      color: #d93025;
      font-weight: 600;
      text-align: center;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Upload Bills (CSV or XLSX)</h1>
    <form method="POST" action="{{ url_for('upload_bills') }}" enctype="multipart/form-data">
      <input type="file" name="file" accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel" required />
      <button type="submit">Upload</button>
    </form>
    <div class="back-link">
      <a href="{{ url_for('dashboard') }}">Back to Dashboard</a>
    </div>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="flash">
          {% for message in messages %}
            <div>{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}
  </div>
</body>
</html>
